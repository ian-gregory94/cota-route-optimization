[project]
name = "cota-opt"
version = "0.1.0"
description = "Columbus/COTA transit digital twin and optimization harness"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "geopandas>=1.0",
    "shapely>=2.0",
    "pyproj>=3.5",
    "networkx>=3.0",
    "requests>=2.31",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "matplotlib>=3.7",
    "scipy>=1.10",
]

[project.optional-dependencies]
# The realtime collector is an optional feature: `cota-opt rt-collect` is the
# only caller, it imports lazily, and no result in this repository depends on
# it (the known-limitations table still records "scheduled != actual" as
# unquantified). It is declared here so the dependency is NAMED rather than
# ambient -- a clean install without it silently skipped 8 tests while the
# reproducibility record claimed 356 passed. `dev` pulls it in so the suite a
# contributor runs is the whole suite.
realtime = ["gtfs-realtime-bindings>=1.0"]
# ntd.parse_profile reads the FTA annual agency profile PDF. Nothing imports
# it at runtime, but the VOMS = 198 that validates the fleet proxy came out of
# it, so a reader reproducing that number needs the parser -- and it was
# undeclared, found by the same check that found the realtime gap.
ntd = ["pdfplumber>=0.10"]
dev = ["pytest>=7.0", "gtfs-realtime-bindings>=1.0", "pdfplumber>=0.10"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# `slow` marks tests that run real certification solves. They are part of the
# suite and run by default -- the path-set identity proof is worth minutes.
# Deselect with `-m "not slow"` when iterating.
markers = [
    "slow: runs a real solve; minutes rather than milliseconds",
]
