[project]
name = "cota-opt"
version = "0.1.0"
description = "Columbus/COTA transit digital twin and optimization harness"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "geopandas>=1.0",
    "shapely>=2.0",
    "pyproj>=3.5",
    "networkx>=3.0",
    "requests>=2.31",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "matplotlib>=3.7",
    "scipy>=1.10",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
